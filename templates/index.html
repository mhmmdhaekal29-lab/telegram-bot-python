<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Chatbot</title>

<style>
:root{
    --purple:#7e57c2;
    --purple-dark:#5e35b1;
    --pink:#f8bbd0;
    --bg:#f6f2ff;
    --text:#333;
    --card:#ffffff;
}

body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#f1f1f1;
}

*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    font-family:"Segoe UI",sans-serif;
}

/* CONTAINER */
.chat-container{
    width:420px;
    height:85vh;
    background:var(--card);
    border-radius:16px;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
    display:flex;
    flex-direction:column;
}

/* HEADER */
.chat-header{
    background:var(--purple);
    color:white;
    padding:14px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:10;
}

.chat-header img{
    width:42px;
    height:42px;
    border-radius:50%;
}

.chat-header h3{
    margin:0;
    font-size:18px;
}

.chat-header span{
    font-size:12px;
    color:#c8e6c9;
}

.toggle{
    margin-left:auto;
    cursor:pointer;
    font-size:18px;
}

/* QUICK BUTTON */
.quick{
    display:flex;
    gap:8px;
    padding:8px;
    flex-wrap:wrap;
    background:var(--bg);
}

.quick button{
    background:var(--pink);
    border:none;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
}

/* CHAT */
.chat-box{
    flex:1;
    padding:15px;
    background:var(--bg);
    overflow-y:auto;
}

.msg{
    max-width:75%;
    margin-bottom:12px;
    display:flex;
    flex-direction:column;
    animation:fadeUp .3s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(10px)}
    to{opacity:1; transform:translateY(0)}
}

.msg.user{align-self:flex-end;text-align:right}
.msg.bot{align-self:flex-start}

.msg span{
    padding:10px 14px;
    border-radius:18px;
    font-size:14px;
}

.user span{
    background:var(--purple);
    color:white;
    border-bottom-right-radius:5px;
}

.bot span{
    background:var(--pink);
    color:#333;
    border-bottom-left-radius:5px;
}

.time{
    font-size:11px;
    opacity:.6;
    margin-top:2px;
}

/* TYPING */
.typing{
    font-size:12px;
    font-style:italic;
    opacity:.7;
    margin:5px 15px;
    display:none;
}

/* INPUT */
.chat-input{
    display:flex;
    padding:10px;
    gap:8px;
    border-top:1px solid #ddd;
    background:var(--card);
}

.chat-input input{
    flex:1;
    padding:10px 14px;
    border-radius:20px;
    border:1px solid #ccc;
    outline:none;
}

.chat-input button{
    background:var(--purple);
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png">
        <div>
            <h3>Hi Snack</h3>
            <span>● Online</span>
        </div>
        <div class="toggle" onclick="toggleMode()">🌙</div>
    </div>

    <div class="quick">
        <button onclick="quickSend('cara order')">📞 Order</button>
        <button onclick="quickSend('alamat')">📍 Alamat</button>
    </div>

    <div class="chat-box" id="chatBox"></div>
    <div class="typing" id="typing">Chatbot sedang mengetik...</div>

    <div class="chat-input">
        <input id="message" placeholder="Tanya tentang Hi Snack...">
        <button onclick="sendMessage()">Kirim</button>
    </div>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("message");
const typing = document.getElementById("typing");

function timeNow(){
    return new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}

function addMessage(text,sender){
    const div=document.createElement("div");
    div.className="msg "+sender;
    div.innerHTML=`
        <span>${text.replace(/\n/g,"<br>")}</span>
        <div class="time">${timeNow()}</div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
}

async function sendMessage(text=null){
    const msg = text ?? input.value.trim();
    if(!msg) return;

    addMessage(msg,"user");
    input.value="";
    typing.style.display="block";

    const res = await fetch("/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ message: msg })   // 🔥 FIX UTAMA
    });

    const data = await res.json();
    typing.style.display="none";
    addMessage(data.reply,"bot");
}

function quickSend(text){
    sendMessage(text);
}

input.addEventListener("keydown",e=>{
    if(e.key==="Enter") sendMessage();
});

function toggleMode(){
    document.body.classList.toggle("dark");
}

addMessage(
    "Halo 👋 Saya <b>Chatbot</b> 🍰<br>Siap membantu, tanyakan produk, jam, cara order, dan alamat.",
    "bot"
);
</script>

</body>
</html>
